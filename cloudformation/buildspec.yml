version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip
      - pip install "setuptools<81" cfn-lint taskcat
  build:
    commands:
      - cfn-lint cloudformation/infrastructure.yaml
      - sed -i "s|203.0.113.10/32|${ALLOWED_SSH_CIDR}|" cloudformation/.taskcat.yml
      - sed -i "s|nt548-lab-key|${KEY_NAME}|" cloudformation/.taskcat.yml
      - cd cloudformation
      - taskcat test run
      - cd ..

artifacts:
  files:
    - cloudformation/infrastructure.yaml
    - cloudformation/codepipeline.yaml
    - cloudformation/.taskcat.yml
