apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nt548-lab02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: nt548/api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ORDERS_SERVICE_URL
              value: http://orders-service:8000
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nt548-lab02
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
